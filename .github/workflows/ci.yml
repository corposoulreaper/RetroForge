name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tests:
    name: Native build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SDL2
        run: |
          sudo apt-get update
          sudo apt-get install --yes libsdl2-dev

      - name: Configure native build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build native targets
        run: cmake --build build --parallel

      - name: Run regression tests
        run: ctest --test-dir build --output-on-failure

  web-build:
    name: WebAssembly build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Configure WebAssembly build
        run: emcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

      - name: Build WebAssembly frontend
        run: cmake --build build-wasm --parallel

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build-wasm

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [native-tests, web-build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4